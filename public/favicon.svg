<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ebazar-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#ebazar-grad)"/>
  
  <!-- Subtle Highlight Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>

  <!-- Shopping Bag Handle -->
  <path d="M24 24V18C24 13.5817 27.5817 10 32 10C36.4183 10 40 13.5817 40 18V24" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Shopping Bag Body -->
  <path d="M14 23H50L46.5 53C46.2 55.5 44 57 41.5 57H22.5C20 57 17.8 55.5 17.5 53L14 23Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Stylized "E" on Bag -->
  <!-- Upper bar -->
  <rect x="23" y="29" width="18" height="4" rx="2" fill="url(#ebazar-grad)"/>
  <!-- Spine -->
  <rect x="23" y="29" width="4.5" height="21" rx="2" fill="url(#ebazar-grad)"/>
  <!-- Middle bar (with warm amber dot) -->
  <rect x="23" y="37.5" width="12" height="4" rx="2" fill="url(#ebazar-grad)"/>
  <circle cx="39" cy="39.5" r="2.5" fill="url(#amber-accent)"/>
  <!-- Bottom bar -->
  <rect x="23" y="46" width="18" height="4" rx="2" fill="url(#ebazar-grad)"/>
</svg>

